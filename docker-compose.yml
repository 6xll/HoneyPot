services:
  # Cowrie Honeypot
  cowrie:
    image: cowrie/cowrie:latest
    container_name: cowrie
    restart: unless-stopped
    ports:
      - "2222:2222"  # SSH honeypot
      - "2223:2223"  # Telnet honeypot
    volumes:
      # Mount cowrie configuration to etc directory
      - ./cowrie-config/cowrie.cfg:/cowrie/cowrie-git/etc/cowrie.cfg:ro
      # Mount entrypoint script for data initialization
      - ./cowrie-entrypoint.sh:/cowrie-entrypoint.sh:ro
      # Persist cowrie logs (shared with Promtail)
      - cowrie-logs:/cowrie/cowrie-git/var/log/cowrie
      # Persist downloaded files from attackers
      - cowrie-downloads:/cowrie/cowrie-git/var/lib/cowrie/downloads
      # Persist TTY recordings
      - cowrie-tty:/cowrie/cowrie-git/var/lib/cowrie/tty
      # Persist share directory with data files
      - cowrie-share:/cowrie/cowrie-git/share
    networks:
      - monitoring
    environment:
      # Cowrie configuration can be overridden via environment variables
      - COWRIE_JSON_ENABLED=yes
      - COWRIE_JSON_LOG=/cowrie/var/log/cowrie/cowrie.json
    entrypoint: ["/cowrie-entrypoint.sh"]
    command: ["/cowrie/cowrie-env/bin/python3", "/cowrie/cowrie-env/bin/twistd", "-n", "--umask=0022", "--pidfile=", "cowrie"]
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "2222"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Promtail - Log Collector
  promtail:
    image: grafana/promtail:2.9.3
    container_name: promtail
    restart: unless-stopped
    volumes:
      # Mount promtail configuration
      - ./promtail-config.yaml:/etc/promtail/config.yml:ro
      # Access to Cowrie logs
      - cowrie-logs:/var/log/cowrie:ro
    command: -config.file=/etc/promtail/config.yml
    networks:
      - monitoring
    depends_on:
      - victorialogs
      - cowrie

  # VictoriaLogs - Log Storage Backend
  victorialogs:
    image: victoriametrics/victoria-logs:v1.45.0
    container_name: victorialogs
    restart: unless-stopped
    ports:
      - "9428:9428"  # HTTP API
    volumes:
      # Persist VictoriaLogs data
      - victorialogs-data:/victoria-logs-data
    command:
      - '--storageDataPath=/victoria-logs-data'
      - '--httpListenAddr=:9428'
      - '--retentionPeriod=30d'  # Keep logs for 30 days
    networks:
      - monitoring
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9428/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Grafana - Visualization Platform
  grafana:
    image: grafana/grafana:10.2.3
    container_name: grafana
    restart: unless-stopped
    ports:
      - "3000:3000"  # Grafana UI
    volumes:
      # Persist Grafana data (dashboards, users, etc.)
      - grafana-data:/var/lib/grafana
      # Provisioning - automatically configure datasources
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      # Custom dashboards (optional)
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    environment:
      # Grafana configuration
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=http://localhost:3000
      - GF_AUTH_ANONYMOUS_ENABLED=false
      - GF_LOG_LEVEL=info
      # Install VictoriaLogs plugin
      - GF_INSTALL_PLUGINS=victoriametrics-logs-datasource
    networks:
      - monitoring
    depends_on:
      - victorialogs
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  monitoring:
    driver: bridge
    name: honeypot-monitoring

volumes:
  # Cowrie data volumes
  cowrie-logs:
    name: cowrie-logs
  cowrie-downloads:
    name: cowrie-downloads
  cowrie-tty:
    name: cowrie-tty
  cowrie-share:
    name: cowrie-share
  # VictoriaLogs data
  victorialogs-data:
    name: victorialogs-data
  # Grafana data
  grafana-data:
    name: grafana-data
