apiVersion: 1

datasources:
  # VictoriaLogs datasource configuration
  - name: VictoriaLogs
    type: prometheus
    access: proxy
    url: http://victorialogs:9428/select/logsql
    isDefault: false  # Changed to false
    editable: true
    jsonData:
      httpMethod: POST
      timeInterval: 30s
      queryTimeout: 60s
      customQueryParameters: ''
    version: 1
    uid: victorialogs-uid

  # Alternative: Using VictoriaLogs with Loki-compatible API
  - name: VictoriaLogs-Loki
    type: loki
    access: proxy
    url: http://victorialogs:9428
    isDefault: true  # This is the default
    editable: true
    jsonData:
      maxLines: 1000
      derivedFields: []
    version: 1
    uid: victorialogs-loki-uid
