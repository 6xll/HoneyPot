apiVersion: 1

datasources:
  # VictoriaLogs datasource configuration
  - name: VictoriaLogs
    type: prometheus
    access: proxy
    url: http://victorialogs:9428/select/logsql
    isDefault: true
    editable: true
    jsonData:
      httpMethod: POST
      # VictoriaLogs supports LogsQL which is similar to Prometheus
      timeInterval: 30s
      queryTimeout: 60s
      # Custom HTTP headers for VictoriaLogs
      customQueryParameters: ''
    version: 1
    uid: victorialogs-uid

  # Alternative: Using VictoriaLogs with Loki-compatible API
  - name: VictoriaLogs-Loki
    type: loki
    access: proxy
    url: http://victorialogs:9428
    isDefault: false
    editable: true
    jsonData:
      maxLines: 1000
      # VictoriaLogs can be queried like Loki
      derivedFields: []
    version: 1
    uid: victorialogs-loki-uid
