# Cowrie Configuration File
# This is a minimal configuration that enables JSON logging
# For full configuration options, see: https://github.com/cowrie/cowrie/blob/master/cowrie.cfg.dist

[honeypot]
# Hostname displayed to the attacker
hostname = svr01
# Log file location
log_path = /cowrie/var/log/cowrie
# Download file storage
download_path = /cowrie/var/lib/cowrie/downloads
# TTY log storage (session recordings)
tty_log_path = /cowrie/var/lib/cowrie/tty
# Maximum file size for downloads (in bytes, 0 = no limit)
download_limit_size = 10485760

# SSH Configuration
[ssh]
# Enable SSH honeypot
enabled = true
# Version string displayed to clients
version = SSH-2.0-OpenSSH_7.4p1 Debian-10+deb9u7
# Listen address
listen_endpoints = tcp:2222:interface=0.0.0.0
# Forward SSH to real SSH on different port (disabled)
# forward_ssh = false

# Telnet Configuration
[telnet]
# Enable Telnet honeypot
enabled = true
# Listen address
listen_endpoints = tcp:2223:interface=0.0.0.0

# JSON Output Configuration
[output_jsonlog]
# Enable JSON logging
enabled = true
# JSON log file location (in log_path)
logfile = /cowrie/var/log/cowrie/cowrie.json
# Log format: 'json' for structured JSON, 'jsonl' for JSON lines
# epoch_timestamp = false  # Use ISO 8601 timestamps

# Text Log Output (optional, for debugging)
[output_textlog]
enabled = true
logfile = /cowrie/var/log/cowrie/cowrie.log

# MySQL Output (disabled by default)
[output_mysql]
enabled = false

# Additional Features
[shell]
# Filesystem to emulate (default Debian-based)
filesystem = share/cowrie/fs.pickle
# Process list
processes = share/cowrie/txtcmds/bin/ps

# Authentication
[backend_pool]
# Authentication backend
enabled = false

# Credentials that will work (fake)
# All login attempts are logged regardless
